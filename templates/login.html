<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartProcure - Login</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; margin-bottom: 24px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
        input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        input:focus { border-color: #4A90E2; outline: none; }
        button { width: 100%; padding: 12px; background-color: #4A90E2; border: none; color: white; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 10px;}
        button:hover { background-color: #357ABD; }
        .alert { padding: 12px; margin-bottom: 20px; border-radius: 4px; font-size: 14px; text-align: center; }
        .alert-error { background-color: #fde8e8; color: #e53e3e; border: 1px solid #fbd5d5; }
        .alert-success { background-color: #def7ec; color: #03543f; border: 1px solid #bcf0da; }
        .redirect-link { text-align: center; margin-top: 15px; font-size: 14px; color: #666; }
        .redirect-link a { color: #4A90E2; text-decoration: none; font-weight: bold; }
        .redirect-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="login-container">
    <h2>SmartProcure Login</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="/login" method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required placeholder="Enter username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required placeholder="Enter password">
        </div>
        <button type="submit">Log In</button>
    </form>
    
    <div class="redirect-link">
        Don't have an account? <a href="{{ url_for('register') }}">Register here</a>
    </div>
</div>

</body>
</html>
